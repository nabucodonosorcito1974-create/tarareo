<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Autocross</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1b1b1b;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:#ff5a1f;padding:6px;gap:6px}
#boardWrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
canvas#board{max-width:100%;max-height:100%;aspect-ratio:758/726;border-radius:8px;box-shadow:inset 0 0 0 3px #e0461a;display:block}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);color:#fff;font-weight:700;padding:8px 14px;border-radius:8px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;text-align:center}
#msg.on{opacity:1}
#dash{flex:0 0 auto;background:linear-gradient(#cfd3d6,#a9aeb2);border-radius:10px;padding:6px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;border:3px solid #e0461a}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
#speedo{width:100%;max-width:120px;height:auto}
.lcd{background:#1d2a1d;color:#9dff8a;font:700 13px ui-monospace,Menlo,monospace;padding:2px 6px;border-radius:4px;letter-spacing:1px}
.row{display:flex;gap:4px;align-items:center}
.bar{position:relative;width:52px;height:18px;background:#222;border-radius:4px;overflow:hidden}.bar>div{position:absolute;left:0;top:0;bottom:0;width:100%;background:#3c3;transition:width .3s,background .3s}.bar>span{position:relative;display:block;text-align:center;font:800 10px/18px system-ui;color:#fff;text-shadow:0 0 2px #000}
#mult{font:800 12px system-ui;color:#c01;min-width:28px}
#rec{font-size:9px;font-weight:800;color:#333}
.small{font-size:10px;color:#333;font-weight:700}
button.ic{border:0;background:#333;color:#fff;border-radius:6px;font-size:13px;width:30px;height:24px;padding:0}
#wheelBox{width:min(38vw,175px);aspect-ratio:1;touch-action:none}
#wheel{width:100%;height:100%;display:block;transform-origin:50% 50%}
/* gear */
#gear{position:relative;width:44px;height:112px;background:#2a2a2a;border-radius:8px;touch-action:none}
#gear .slot{position:absolute;left:60%;top:10px;bottom:10px;width:6px;margin-left:-3px;background:#000;border-radius:3px}
#gear .n{position:absolute;left:5px;font-size:11px;font-weight:800;color:#ddd;transform:translateY(-50%)}
#knob{position:absolute;left:60%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#666,#111);box-shadow:0 2px 3px rgba(0,0,0,.5);transform:translateY(-50%);transition:top .12s}
/* key */
#keyBox{display:flex;align-items:center;gap:4px}
#keyLbl{display:flex;flex-direction:column;gap:2px;font-size:9px;font-weight:800;color:#222;text-align:right}
#keyLbl span{display:flex;align-items:center;gap:3px;justify-content:flex-end}
#keyLbl i{width:7px;height:7px;border-radius:50%;background:#555;display:inline-block}
#keyLbl i.on{background:#ff2d2d;box-shadow:0 0 5px #f00}
#key{width:40px;height:40px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle,#eee,#999);position:relative;border:2px solid #555;touch-action:none}
#key .blade{position:absolute;left:50%;top:50%;width:9px;height:30px;margin:-15px 0 0 -4.5px;background:#c41c1c;border-radius:4px;transition:transform .15s}
#key .blade:after{content:"";position:absolute;left:-6px;top:-4px;width:22px;height:14px;background:#fff;border-radius:6px;border:1px solid #999}
</style>
</head>
<body>
<div id="app">
  <div id="boardWrap"><canvas id="board" width="758" height="726"></canvas><div id="msg"></div></div>
  <div id="dash">
    <div class="col">
      <svg id="speedo" viewBox="0 0 120 70"></svg>
      <div class="row"><span class="lcd" id="odo">000000</span><span id="mult">x1</span></div><div class="row"><span class="lcd" id="tm">2:00</span><span id="rec">Récord 0</span></div>
      <div class="row"><div class="bar" title="Salud del coche"><div id="hpBar"></div><span id="hpTxt">❤100</span></div><div class="bar" title="Gasolina"><div id="fuBar"></div><span id="fuTxt">⛽100</span></div></div>
      <div class="row"><button class="ic" id="snd" title="Sonido">🔇</button><button class="ic" id="rst" title="Reiniciar">↺</button></div>
    </div>
    <div id="wheelBox"><svg id="wheel" viewBox="-100 -100 200 200">
      <circle r="88" fill="none" stroke="#111" stroke-width="18"/>
      <circle r="88" fill="none" stroke="#2c2c2c" stroke-width="3" stroke-dasharray="3 6"/>
      <path d="M-80,10 L-25,6 L-18,60 L18,60 L25,6 L80,10 L80,-6 L25,-14 L-25,-14 L-80,-6Z" fill="#141414"/>
      <circle r="24" fill="#141414"/><circle r="15" fill="#d81e1e"/><circle r="9" cx="-4" cy="-4" fill="#ff5b5b" opacity=".6"/>
      <rect x="-4" y="-97" width="8" height="12" rx="2" fill="#ffcc00"/>
    </svg></div>
    <div class="col">
      <div id="keyBox">
        <div id="keyLbl"><span>MAX <i id="lMax"></i></span><span>STOP <i id="lStop" class="on"></i></span><span>MIN <i id="lMin"></i></span></div>
        <div id="key"><div class="blade"></div></div>
      </div>
      <div id="gear"><div class="slot"></div><div id="knob"></div></div>
    </div>
  </div>
</div>

const W=758,H=726;
const cv=document.getElementById('board'),ctx=cv.getContext('2d');
const img=new Image(),mimg=new Image();
let mask=null;
const START={x:380,y:700,a:0};
const st={x:START.x,y:START.y,a:START.a,v:0,wheel:0,gear:1,key:0 /* -1 MIN, 0 STOP, 1 MAX */,odo:0,outs:0,crash:0,safe:[],health:100,over:false,fuel:100,refuel:0,lowWarn:false,time:120,started:false};
let dragging=false,lastPtrAng=0,soundOn=false;

function onRoad(x,y){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H)return false;return mask[(y*W+x)*4]>127}
function loadMask(){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(mimg,0,0);mask=g.getImageData(0,0,W,H).data}

/* ---------- speedometer ---------- */
const sp=document.getElementById('speedo');
(function(){let s='<path d="M10,62 A50,50 0 0 1 110,62" fill="none" stroke="#222" stroke-width="4"/>';
 for(let i=0;i<=9;i++){const a=Math.PI*(1-i/9),c=Math.cos(a),n=Math.sin(a);s+=`<line x1="${60+c*44}" y1="${62-n*44}" x2="${60+c*50}" y2="${62-n*50}" stroke="#222" stroke-width="2"/>`;if(i%3==0)s+=`<text x="${60+c*34}" y="${66-n*34}" font-size="9" font-weight="700" text-anchor="middle" fill="#222">${i*20}</text>`}
 s+='<line id="needle" x1="60" y1="62" x2="14" y2="62" stroke="#e01b1b" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="62" r="4" fill="#222"/>';sp.innerHTML=s})();
const needle=()=>document.getElementById('needle');

/* ---------- gear lever (4 posiciones) ---------- */
const gearEl=document.getElementById('gear'),knob=document.getElementById('knob');
const gearY=g=>10+(g-1)*(92/3)+0; // px from top inside 112 box (1 arriba, 4 abajo)
function drawGearLabels(){for(let g=1;g<=4;g++){const d=document.createElement('div');d.className='n';d.textContent=g;d.style.top=(gearY(g)+0)+'px';gearEl.appendChild(d)}}
function setGear(g){st.gear=Math.max(1,Math.min(4,g));knob.style.top=gearY(st.gear)+'px'}
function gearFromEvent(e){const r=gearEl.getBoundingClientRect();const y=(e.clientY-r.top)*(112/r.height);return Math.round((y-10)/(92/3))+1}
gearEl.addEventListener('pointerdown',e=>{gearEl.setPointerCapture(e.pointerId);setGear(gearFromEvent(e));click()});
gearEl.addEventListener('pointermove',e=>{if(e.buttons||e.pressure>0){const g=Math.max(1,Math.min(4,gearFromEvent(e)));if(g!==st.gear){setGear(g);click()}}});

/* ---------- key ---------- */
const keyEl=document.getElementById('key'),blade=keyEl.querySelector('.blade');
function setKey(k){st.key=k;blade.style.transform=`rotate(${k*-55}deg)`;
 document.getElementById('lMax').className=k==1?'on':'';document.getElementById('lStop').className=k==0?'on':'';document.getElementById('lMin').className=k==-1?'on':'';
 ensureAudio();click()}
// toca la mitad superior = MAX, centro = STOP, inferior = MIN; o toques sucesivos
keyEl.addEventListener('pointerdown',e=>{const r=keyEl.getBoundingClientRect();const y=(e.clientY-r.top)/r.height;
 if(y<0.36)setKey(1);else if(y>0.64)setKey(-1);else setKey(st.key==0?-1:0)});

/* ---------- wheel ---------- */
const wb=document.getElementById('wheelBox'),wheel=document.getElementById('wheel');
function ptrAng(e){const r=wb.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
wb.addEventListener('pointerdown',e=>{dragging=true;wb.setPointerCapture(e.pointerId);lastPtrAng=ptrAng(e);ensureAudio()});
wb.addEventListener('pointermove',e=>{if(!dragging)return;const a=ptrAng(e);let d=a-lastPtrAng;if(d>180)d-=360;if(d<-180)d+=360;lastPtrAng=a;st.wheel=Math.max(-150,Math.min(150,st.wheel+d))});
const endDrag=()=>{dragging=false};wb.addEventListener('pointerup',endDrag);wb.addEventListener('pointercancel',endDrag);

/* teclado (para probar en ordenador) */
const keys={};addEventListener('keydown',e=>{keys[e.key]=1;if('1234'.includes(e.key))setGear(+e.key);if(e.key=='m')setKey(-1);if(e.key=='x')setKey(1);if(e.key=='s')setKey(0)});addEventListener('keyup',e=>keys[e.key]=0);

/* ---------- sonido ---------- */
let ac=null,osc=null,gain=null,lfo=null;
function ensureAudio(){if(ac||!soundOn)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';gain=ac.createGain();gain.gain.value=0;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;osc.connect(f);f.connect(gain);gain.connect(ac.destination);osc.start()}catch(e){ac=null}}
function click(){if(navigator.vibrate)navigator.vibrate(8)}
document.getElementById('snd').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊':'🔇';if(soundOn)ensureAudio();if(ac&&gain)gain.gain.value=0};
document.getElementById('rst').onclick=()=>{Object.assign(st,{x:START.x,y:START.y,a:START.a,v:0,odo:0,outs:0,crash:0,safe:[],health:100,over:false,fuel:100,refuel:0,lowWarn:false,time:GAME_TIME,started:false});msgEl.classList.remove('on');st.wheel=0;setKey(0);setGear(1);updLcd()};

const msgEl=document.getElementById('msg');let msgT=0;
function msg(t,ms=1100){msgEl.innerHTML=t;msgEl.classList.add('on');clearTimeout(msgT);if(ms)msgT=setTimeout(()=>msgEl.classList.remove('on'),ms)}
let best=0;try{best=+localStorage.getItem('autocrossBest')||0}catch(e){}
function updLcd(){document.getElementById('odo').textContent=String(Math.floor(st.odo)).padStart(6,'0');const h=Math.max(0,st.health);hpBar.style.width=h+'%';hpBar.style.background=h>60?'#3c3':h>30?'#f0b400':'#e22';hpTxt.textContent='❤'+h;
 const f=Math.max(0,Math.ceil(st.fuel));fuBar.style.width=f+'%';fuBar.style.background=f>40?'#2a8cff':f>15?'#f0b400':'#e22';fuTxt.textContent='⛽'+f;document.getElementById('rec').textContent='Récord '+best}
const hpBar=document.getElementById('hpBar'),hpTxt=document.getElementById('hpTxt'),fuBar=document.getElementById('fuBar'),fuTxt=document.getElementById('fuTxt'),multEl=document.getElementById('mult'),tmEl=document.getElementById('tm');
/* zonas: exterior x1, intermedio x1.2, interior x1.5 */
function zoneMult(x,y){const r=Math.hypot(x-380,y-375);return r>=290?1:r>=205?1.2:1.5}
/* surtidores (x 322-411, y 532-553) con margen */
const STATION={x0:322-30,x1:411+30,y0:532-34,y1:553+34};
function atStation(){return st.x>STATION.x0&&st.x<STATION.x1&&st.y>STATION.y0&&st.y<STATION.y1}
function gameOver(why){st.over=true;st.crash=0;const pts=Math.floor(st.odo);if(pts>best){best=pts;try{localStorage.setItem('autocrossBest',best)}catch(e){}}updLcd();msg(`${why}<br>${pts} puntos · Récord ${best}<br><small>Pulsa ↺ para volver a jugar</small>`,0)}

/* ---------- física ---------- */
const GEAR_SPEED=[0,16,32,52,76]; // px/s en MIN BAT
const BAT=1.65;                   // multiplicador MAX BAT
/* depósito: en 2ª con MAX BAT se vacía en 60 s; el resto, proporcional a la velocidad */
const FUEL_PER_PX=100/(60*GEAR_SPEED[2]*BAT);
const GAME_TIME=120;
const MIN_R=26;                   // radio de giro mínimo (px)
let safeT=0,last=performance.now();
function step(dt){
  // teclado
  if(keys.ArrowLeft)st.wheel=Math.max(-150,st.wheel-260*dt);
  if(keys.ArrowRight)st.wheel=Math.min(150,st.wheel+260*dt);
  if(!dragging&&!keys.ArrowLeft&&!keys.ArrowRight){st.wheel*=Math.pow(0.02,dt);if(Math.abs(st.wheel)<0.5)st.wheel=0}
  wheel.style.transform=`rotate(${st.wheel}deg)`;
  let target=(st.key==0||st.over)?0:GEAR_SPEED[st.gear]*(st.key==1?BAT:1);
  if(st.crash>0){st.crash-=dt;target=0;st.v=0;
    if(st.crash<=0){const s=st.safe.length?st.safe[0]:START;st.x=s.x;st.y=s.y;st.a=s.a;st.safe=[]}}
  st.v+=(target-st.v)*Math.min(1,dt*3);
  if(st.v>0.05&&st.crash<=0&&!st.over){
    const d=st.v*dt;const curv=(st.wheel/150)/MIN_R;
    st.a+=curv*d;st.x+=Math.cos(st.a)*d;st.y+=Math.sin(st.a)*d;const zm=zoneMult(st.x,st.y);st.odo+=d*0.5*zm;multEl.textContent='x'+zm;
    st.fuel-=d*FUEL_PER_PX;
    if(st.fuel<=20&&!st.lowWarn){st.lowWarn=true;msg('⛽ ¡Reserva! Para junto a los surtidores',1800)}
    if(st.fuel<=0){st.fuel=0;updLcd();gameOver('⛽ Sin gasolina')}
    const fx=st.x+Math.cos(st.a)*16,fy=st.y+Math.sin(st.a)*16;
    if(!onRoad(fx,fy)||!onRoad(st.x,st.y)){st.crash=1.1;st.outs++;const dmg=Math.round(5+15*Math.min(1,st.v/125));st.health-=dmg;
      if(st.health<=0){st.health=0;gameOver('💥 Coche destrozado')}
      else msg(`¡Fuera de pista! −${dmg}`);if(navigator.vibrate)navigator.vibrate([60,40,60])}
    safeT+=dt;if(safeT>0.25&&st.crash<=0){safeT=0;st.safe.push({x:st.x-Math.cos(st.a)*6,y:st.y-Math.sin(st.a)*6,a:st.a});if(st.safe.length>6)st.safe.shift()}
    updLcd()}
  // cronómetro de 2 minutos (empieza al girar la llave)
  if(!st.over&&st.key!=0)st.started=true;
  if(st.started&&!st.over){st.time-=dt;if(st.time<=0){st.time=0;gameOver('⏱ ¡Tiempo!')}}
  {const s=Math.ceil(st.time);tmEl.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');tmEl.style.color=s<=15?'#ff5050':''}
  // repostar: parado (llave en STOP) junto a la gasolinera 5 s
  if(!st.over&&st.key==0&&st.v<1&&atStation()&&st.fuel<100){st.refuel+=dt;const left=Math.ceil(5-st.refuel);
    if(st.refuel>=5){st.fuel=100;st.refuel=0;st.lowWarn=false;msg('⛽ Depósito lleno',1300);updLcd()}else msg('⛽ Repostando… '+left,600)}
  else st.refuel=0;
  // velocímetro: 0-180
  const kmh=Math.min(180,st.v*1.4);const ang=Math.PI*(1-kmh/180);
  const n=needle();n.setAttribute('x2',60+Math.cos(ang)*46);n.setAttribute('y2',62-Math.sin(ang)*46);
  if(ac&&gain){gain.gain.value=soundOn&&st.key!=0?0.05:0;osc.frequency.value=45+st.v*1.6+st.gear*6}
}
function drawCar(){
  ctx.save();ctx.translate(st.x,st.y);ctx.rotate(st.a);ctx.scale(1.2,1.0);
  if(st.crash>0)ctx.rotate(Math.sin(st.crash*40)*0.15);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(2,3,22,14,0,0,7);ctx.fill();
  // ruedas
  ctx.fillStyle='#111';for(const [x,y] of [[-12,-13],[12,-13],[-12,13],[12,13]]){ctx.fillRect(x-6,y-3,12,6)}
  // carrocería
  ctx.fillStyle='#e8361c';ctx.beginPath();ctx.roundRect(-20,-12,40,24,7);ctx.fill();
  ctx.fillStyle='#ff6a3d';ctx.fillRect(-18,-10,36,3);
  // techo blanco
  ctx.fillStyle='#fafafa';ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(-9,-9,18,18,3);ctx.fill();ctx.stroke();
  // faros
  ctx.fillStyle='#ffe66b';ctx.fillRect(17,-10,3,5);ctx.fillRect(17,5,3,5);
  ctx.restore()}
function frame(t){const dt=Math.min(0.05,(t-last)/1000);last=t;if(mask)step(dt);
  ctx.drawImage(img,0,0);drawCar();requestAnimationFrame(frame)}

drawGearLabels();setGear(1);setKey(0);updLcd();
let loaded=0;const ok=()=>{if(++loaded==2){loadMask();requestAnimationFrame(frame);msg('Gira la llave y mueve el volante',2200)}};
img.onload=ok;mimg.onload=ok;img.src=BOARD_SRC;mimg.src=MASK_SRC;
</script>
</body>
</html>
