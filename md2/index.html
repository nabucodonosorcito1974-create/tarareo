<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Day II</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font:13px/1.3 ui-monospace,Menlo,Consolas,monospace}
#bar{display:flex;gap:6px;align-items:center;padding:4px 8px;background:#111;flex-wrap:wrap}
#bar b{color:#ff0;margin-right:auto}
#bar button{background:#222;color:#fff;border:1px solid #444;border-radius:4px;padding:3px 8px;font:inherit;cursor:pointer}
#bar span{color:#aaa}
#wrap{display:flex;justify-content:center;padding:6px}
#jsspeccy{background:#000}
#start{position:fixed;inset:40px 0 0 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#000;cursor:pointer}
#start div{border:2px solid #ff0;color:#ff0;padding:14px 22px;font-size:18px;letter-spacing:1px}
#start p{color:#aaa;max-width:420px;text-align:center}
</style></head>
<body>
<div id="bar"><b>MATCH DAY II</b><span>Teclas y joystick: se eligen en el menú del juego</span><button id="fs">⛶</button></div>
<div id="wrap"><div id="jsspeccy"></div></div>
<div id="start"><div>▶ PULSA PARA CARGAR LA CINTA</div><p>Spectrum 128K · carga rápida de la cinta: unos segundos</p></div>
<script src="jsspeccy/jsspeccy.js?v=8"></script>
<script>
{
let emu=null;
window.MD2TURBO=!/noturbo/.test(location.search); // carga de cinta a toda velocidad (sin sonido mientras carga)
const zoom=()=>Math.max(1,Math.min(Math.floor((innerWidth-12)/320),Math.floor((innerHeight-90)/256)));
document.getElementById('start').addEventListener('click',e=>{
  e.currentTarget.remove();
  emu=JSSpeccy(document.getElementById('jsspeccy'),{machine:128,openUrl:'matchday2.tzx',autoStart:true,autoLoadTapes:true,tapeTrapsEnabled:!/notraps/.test(location.search),sandbox:true,zoom:zoom()});
  window.emu=emu;
  // El BASIC carga al instante; cuando el cargador SpeedLock se queda esperando (pantalla quieta),
  // se pulsa "play" en la cinta una sola vez y se reproduce a toda velocidad.
  const t0=performance.now();let last=null,same=0,played=false;
  const hash=()=>{const c=document.querySelector('#jsspeccy canvas');if(!c)return 0;const g=hash.g||(hash.g=document.createElement('canvas'));g.width=64;g.height=48;const x=g.getContext('2d');x.drawImage(c,0,0,64,48);const d=x.getImageData(0,0,64,48).data;let s=0;for(let i=0;i<d.length;i+=4)s=(s*31+d[i]+d[i+1]*7+d[i+2]*13)|0;return s;};
  const iv=setInterval(()=>{
    const e=window.__emu;if(!e||played){if(played)clearInterval(iv);return;}
    if(e.tapeIsPlaying){played=true;return;}
    const h=hash();same=(h===last)?same+1:0;last=h;
    if(performance.now()-t0>4500&&same>=3){played=true;e.playTape();}
  },500);
});
addEventListener('resize',()=>{if(emu)emu.setZoom(zoom());});
document.getElementById('fs').onclick=()=>{if(emu)emu.toggleFullscreen();};
}
</script>
</body></html>
